name: Build iOS IPA (zip'ten)

# Repoya SADECE zip dosyasını yükle (ör. Jarvis-iOS.zip). Workflow zip'i açar,
# içinde project.yml'i kendisi bulur ve .ipa üretir. Zip kökte olmalı.
# Birden fazla zip varsa elle çalıştırırken "zip_name" alanına adını yaz.

on:
  push:
    branches: [ main, master ]
    paths: [ '**.zip', '.github/workflows/build-ipa.yml' ]
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip dosyasının adı (boşsa kökteki ilk .zip)"
        required: false
        default: ""

# İmzalı IPA için (isteğe bağlı) Settings > Secrets > Actions:
#   IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISION_BASE64, IOS_TEAM_ID
# Secret yoksa sadece İMZASIZ IPA üretilir (AltStore / Sideloadly / TrollStore).

env:
  SCHEME: Jarvis
  APP_NAME: Jarvis
  SIGN_IDENTITY: Apple Distribution      # development profili için: Apple Development
  EXPORT_METHOD: ad-hoc                  # ad-hoc | development | app-store

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      IOS_PROVISION_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      ZIP_INPUT: ${{ github.event.inputs.zip_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Zip'i bul ve aç
        run: |
          if [ -n "$ZIP_INPUT" ]; then
            ZIP="$ZIP_INPUT"
          else
            ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          fi
          [ -n "$ZIP" ] && [ -f "$ZIP" ] || { echo "::error::Repo kökünde .zip bulunamadı"; ls -la; exit 1; }
          echo "Zip: $ZIP"
          rm -rf _src && mkdir _src
          unzip -q "$ZIP" -d _src
          SPEC=$(find _src -name project.yml -not -path '*/__MACOSX/*' | head -1)
          [ -n "$SPEC" ] || { echo "::error::Zip içinde project.yml yok"; find _src | head -50; exit 1; }
          DIR=$(cd "$(dirname "$SPEC")" && pwd)
          echo "Proje klasörü: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/out"

      - name: XcodeGen kur ve projeyi üret
        run: |
          brew install xcodegen
          cd "$PROJECT_DIR"
          xcodegen generate
          xcodebuild -version

      # ---------- 1) İMZASIZ IPA (her zaman) ----------
      - name: Derle (imzasız)
        run: |
          cd "$PROJECT_DIR"
          xcodebuild build \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: IPA'ya paketle
        run: |
          cd "$PROJECT_DIR"
          APP="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/out/$APP_NAME-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/out"

      # ---------- 2) İMZALI IPA (secret'lar varsa) ----------
      - name: Sertifika ve profili kur
        if: env.IOS_P12_BASE64 != '' && env.IOS_PROVISION_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROVISION_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "tmp-pass" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "tmp-pass" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "tmp-pass" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PUUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PNAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PUUID.mobileprovision"
          echo "PROFILE_NAME=$PNAME" >> "$GITHUB_ENV"

      - name: Archive + export (imzalı)
        if: env.IOS_P12_BASE64 != '' && env.IOS_PROVISION_BASE64 != ''
        run: |
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.jarvis.ai</key><string>$PROFILE_NAME</string>
            </dict>
            <key>compileBitcode</key><false/>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$APP_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa "$GITHUB_WORKSPACE/out/$APP_NAME-signed.ipa"

      - name: IPA'ları yükle
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-ipa
          path: out/*.ipa
          if-no-files-found: error
          
